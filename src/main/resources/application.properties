#
# Startup-layer configuration (frozen at boot). Keys mirror the code-defined schema
# under prefix featureflag.config. Invalid/ill-typed values fail application startup.
#
# Required key (no in-code default); choose sandbox locally.
featureflag.config.payment.mode=sandbox
featureflag.config.service.timeoutMs=1500
featureflag.config.service.maxRetries=4
featureflag.config.ui.theme=system
featureflag.config.cache.enabled=true

# Web
server.port=8080
